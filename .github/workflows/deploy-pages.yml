name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose and install
        run: |
          echo "=== npm registry config ==="
          npm config get registry
          echo "=== connectivity official ==="
          curl -sS -m 20 -o /dev/null -w "official http=%{http_code} time=%{time_total}\n" https://registry.npmjs.org/ || true
          echo "=== connectivity npmmirror ==="
          curl -sS -m 20 -o /dev/null -w "npmmirror http=%{http_code} time=%{time_total}\n" https://registry.npmmirror.com/ || true
          echo "=== npm install ==="
          npm install --registry=https://registry.npmjs.org/ --no-audit --no-fund 2>&1 | tee install-diag.log || true

      - name: Report install log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-diag.log
          git commit -m "诊断: 回传 install 日志"
          git push

      - name: Build
        run: npm run build:gh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ghpages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
