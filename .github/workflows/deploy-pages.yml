name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix package.json version range
        run: |
          sed -i 's#"@radix-ui/react-label": "^1.1.14"#"@radix-ui/react-label": "^2.1.7"#g' package.json

      - name: Fix JSX closing tags
        run: |
          sed -i '138s#</Tooltip>#</TooltipTrigger>#' src/pages/ComponentsPage.tsx
          sed -i '232s#</CardContent>#</CardHeader>#' src/pages/ReportsPage.tsx

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org/ --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Build
        run: npm run build:gh

      - name: Enable Pages via API
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' -o enable-resp.json -w "http=%{http_code}\n" || true
          echo "--- response ---"
          cat enable-resp.json || true
          echo

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ghpages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
